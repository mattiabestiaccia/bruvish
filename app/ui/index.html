<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Lavish</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head>
<body><header class="toolbar"><button id="home" class="brand" aria-label="Mostra tutti i Lavish">Lavish</button><nav id="tabs" aria-label="Review aperte"></nav><button id="transparent" aria-pressed="false" title="Mostra lo sfondo con blur">Trasparenza</button><label class="artifact-option"><input id="artifact-background" type="checkbox" checked> Anche artefatti</label><button id="choose" title="Apri un file HTML">Apri HTML…</button></header>
<main id="catalog"><div class="heading"><div><p class="eyebrow">IL TUO SPAZIO DI REVISIONE</p><h1>I tuoi Lavish</h1><p class="intro">Ritrova un artefatto. Le review già aperte restano nella loro scheda.</p></div><div class="heading-actions"><button id="layout" aria-pressed="false" title="Alterna elenco e griglia compatta">Griglia</button><button id="refresh">Aggiorna</button></div></div>
<div class="filters"><label class="search">Cerca<input id="search" type="search" placeholder="Nome o percorso dell’artefatto" autocomplete="off"></label><label>Mostra<select id="filter"><option value="all">Tutti</option><option value="active">Attivi</option><option value="ended">Conclusi</option></select></label><label>Raccolta<select id="collection"><option value="all">Tutti</option><option value="favorites">Preferiti</option><option value="pinned">Pinnati</option></select></label></div>
<p id="status" role="status" aria-live="polite"></p><div id="reviews" class="reviews"></div><p id="empty" hidden>Nessun Lavish trovato. Puoi aprire un file HTML oppure crearne uno con un agente.</p>
<footer>Le schede condividono lo stesso servizio Lavish. Chiudere una scheda non termina la review.</footer></main>
<div id="error" role="alert" hidden></div></body></html>
