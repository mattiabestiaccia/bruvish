<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Bruvish</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="catalog.css"><script src="app.js" defer></script></head>
<body><header class="toolbar"><button id="index" class="index" aria-label="Indice degli artefatti" title="Indice degli artefatti"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3m5-5L3 8l5 5"/></svg></button><button id="home" class="brand" aria-label="Mostra tutti i Lavish">BRUVISH</button><nav id="tabs" aria-label="Review aperte"></nav><div id="toolbar-actions" role="group" aria-label="Controlli della finestra e della review"><button id="transparent" role="switch" aria-checked="false" aria-label="Trasparenza" title="Trasparenza"><span class="switch-track" aria-hidden="true"><span class="switch-knob"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11M8 5l3 3-3 3"/></svg></span></span></button><div id="review-actions" hidden><button id="closed" class="icon-switch" role="switch" aria-checked="false" aria-label="Anche le carte chiuse" title="Anche le carte chiuse" hidden><span class="switch-track" aria-hidden="true"><span class="switch-knob"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.7"/><path d="m5.4 8.1 1.8 1.8 3.4-3.6"/></svg></span></span></button><button id="annotate" class="icon-switch" role="switch" aria-checked="false" aria-label="Annota" title="Annota" disabled><span class="switch-track" aria-hidden="true"><span class="switch-knob"><svg viewBox="0 0 16 16"><path d="m10.4 2.8 2.8 2.8-7.5 7.5-3.4.6.6-3.4zM8.9 4.3l2.8 2.8"/></svg></span></span></button><button id="warnings" class="review-button" aria-label="Problemi di impaginazione" title="Problemi di impaginazione" aria-expanded="false" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 15 14H1ZM8 6v4m0 2v.1"/></svg><span class="control-count" hidden></span></button><button id="revisions" class="review-button" aria-label="Revisioni" title="Revisioni" aria-expanded="false" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6a5 5 0 1 1 0 5M3 2v4h4M8 5v4l2 1"/></svg><span class="control-count" hidden></span></button><button id="panel" class="review-button" aria-label="Mostra la conversazione" title="Mostra la conversazione" aria-expanded="false" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1"/><path d="M9.5 2.5v11"/></svg><span class="control-count" hidden></span></button><button id="more" class="review-button" aria-label="Altro" title="Altro" aria-expanded="false" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="3" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="8" cy="13" r="1"/></svg></button></div></div></header>
<main id="catalog"><div class="heading"><div><h1>I tuoi Lavish</h1><p class="intro">Ritrova un artefatto. Le review già aperte restano nella loro scheda.</p></div><button id="refresh">Aggiorna</button></div>
<div class="filters"><div class="search"><label for="search">Cerca nel titolo</label><input id="search" type="search" placeholder="Inizia a digitare" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions"><ul id="suggestions" role="listbox" aria-label="Titoli trovati" hidden></ul></div><details id="catalog-filter"><summary class="catalog-icon" aria-label="Filtri di ricerca" title="Filtri di ricerca"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg></summary><div id="filter-options"></div></details></div>
<nav id="folder-bar" aria-label="Cartelle"><div id="folders"></div><button id="new-folder" class="catalog-icon" aria-label="Nuova cartella" title="Nuova cartella" aria-expanded="false" aria-controls="folder-form"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v12H3zM12 11v6m-3-3h6"/></svg></button></nav>
<form id="folder-form" hidden><label for="folder-name">Nome della cartella</label><input id="folder-name" required maxlength="40"><button type="submit">Crea</button><button type="button" id="cancel-folder">Annulla</button></form>
<p id="status" role="status" aria-live="polite"></p><div id="reviews" class="reviews"></div><p id="empty" hidden>Nessun Lavish in questa vista. <button id="clear-catalog">Mostra tutti</button></p><section id="catalog-info" popover aria-labelledby="catalog-info-title"></section>
<footer>Le schede condividono lo stesso servizio Lavish. Chiudere una scheda non termina la review.</footer></main>
<div id="error" role="alert" hidden></div></body></html>
